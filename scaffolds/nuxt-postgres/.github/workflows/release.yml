name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run nuxt typecheck

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/project-template

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract version from release
        if: github.event_name == 'release'
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }}
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name == 'release' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  helm:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA and lowercase owner
        id: sha
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract version from release
        if: github.event_name == 'release'
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login Helm to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Bake image refs into values.yaml
        run: |
          TAG="${{ steps.sha.outputs.short }}"
          REPO="${{ steps.sha.outputs.repo }}"
          sed -i "s|repository: project-template|repository: ghcr.io/${REPO}|" deploy/helm/project-template/values.yaml
          sed -i "/ghcr.io\/${REPO}/,/tag:/s|tag: \".*\"|tag: \"${TAG}\"|" deploy/helm/project-template/values.yaml

      - name: Package and push SHA chart
        run: |
          helm package deploy/helm/project-template --version "0.0.0-${{ steps.sha.outputs.short }}" --app-version "${{ steps.sha.outputs.short }}"
          helm push project-template-0.0.0-${{ steps.sha.outputs.short }}.tgz oci://ghcr.io/${{ steps.sha.outputs.owner }}/charts

      - name: Package and push rolling latest chart
        run: |
          helm package deploy/helm/project-template --version "0.0.0" --app-version "${{ steps.sha.outputs.short }}"
          helm push project-template-0.0.0.tgz oci://ghcr.io/${{ steps.sha.outputs.owner }}/charts

      - name: Package and push versioned chart
        if: github.event_name == 'release'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ steps.sha.outputs.repo }}"
          sed -i "/ghcr.io\/${REPO}/,/tag:/s|tag: \".*\"|tag: \"${VERSION}\"|" deploy/helm/project-template/values.yaml
          helm package deploy/helm/project-template --version "$VERSION" --app-version "$VERSION"
          helm push project-template-$VERSION.tgz oci://ghcr.io/${{ steps.sha.outputs.owner }}/charts
